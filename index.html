<!DOCTYPE html>
<html lang="pr-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2 realidade aumentada</title>
    <script src="http://aframe.io/realeses/1.6.0/afraame.min.js"></script>
    <script src="http://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene
    mindar-image="imageTargetSrc: http://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/example/image-tracking/assets/card-example/"
    vr-mode-ui="enable: false"
    device-orientation-permission-ui="enabled: false">

        <a-camera
            position="0 0 0"
            look-control="enabled: false">
            
        </a-camera>
<!--O =bjeto associado a imagem que será reconhecida-->
        <a-entity
        mindar-image-target="targetIndex: 0">
            <!--Cubo virtual-->
            <a-box
            position="0 0 0.5"
            rotation = "0 0 0"
            scale="0.5 0.5 0.5">

            </a-box>

        </a-entity>



    </a-scene>
</body>
</html>
